<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissors">Scissors</button>
    <div id="results"></div>
    <script>

        const buttons = document.querySelectorAll("button");
        const div = document.querySelector("div");
        buttons.forEach(button => {
            button.addEventListener("click", (e) => {
                let playerSelection = e.target.id;
                if(computerScore >= 5 || humanScore >= 5){
                    humanScore = 0;
                    computerScore = 0;
                    div.replaceChildren();
                }
                playRound(playerSelection, getComputerChoice());
            })
        })

        let humanScore = 0;
        let computerScore = 0;
        function getComputerChoice(){
            let choice = "";
            let randomNumber = Math.random();
            if(randomNumber <= 0.33){
                choice = "rock"
            }
            else if(randomNumber <= 0.66){
                choice = "scissors";
            }
            else{
                choice = "paper";
            }
            return choice;
        }

        function playRound(x, y){
            const p = document.createElement("p");
            if(x == "paper" && y == "scissors"){
                p.textContent = "\nYou lose! Scissors beats Paper";
                div.append(p);
                computerScore += 1;
            }
            else if(x == "paper" && y == "rock"){
                p.textContent = "\nYou win! Paper beats Rock";
                div.append(p);
                humanScore += 1;
            }
            else if(x == "rock" && y == "scissors"){
                p.textContent = "\nYou win! Rock beats Scissors";
                div.append(p);
                humanScore += 1;
            }
            else if(x == "rock" && y == "paper"){
                p.textContent = "\nYou lose! Paper beats Rock";
                div.appendChild(p);
                computerScore += 1;
            }
            else if(x == "scissors" && y == "paper"){
                p.textContent = "\nYou win! Scissors beats Paper";
                div.append(p);
                humanScore += 1;
            }
            else if(x == "scissors" && y == "rock"){
                p.textContent = "\nYou lose! Rock beats Scissors";
                div.append(p);
                computerScore += 1;
            }
            else if(x == y)
            {
                p.textContent = "\nIts a tie!";
                div.append(p);
            }

            if(computerScore >= 5 || humanScore >= 5){
                const pEnd = document.createElement("p");
                if(humanScore > computerScore){
                    pEnd.textContent = `\n\nCongratulations, you win! You had ${humanScore} points and your opponent had ${computerScore} points`;
                    div.appendChild(pEnd);
                }
                else{
                    pEnd.textContent = `\n\nBOO, you lose! You had ${humanScore} points and your opponent had ${computerScore} points`;
                    div.appendChild(pEnd);
                }
            }
        }
    </script>
</body>
</html>
