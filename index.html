<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <script>
        let humanScore = 0;
        let computerScore = 0;
        function getComputerChoice(){
            let choice = "";
            let randomNumber = Math.random();
            if(randomNumber <= 0.33){
                choice = "rock"
            }
            else if(randomNumber <= 0.66){
                choice = "scissors";
            }
            else{
                choice = "paper";
            }
            return choice;
        }
        
        function getHumanChoice(){
            let choice = prompt("Type your choice: ");
            return choice.toLowerCase();
        }
        
        function playRound(x, y){
            if(x == "paper" && y == "scissors"){
                console.log("You lose! Scissors beats Paper");
                computerScore += 1;
            }
            else if(x == "paper" && y == "rock"){
                console.log("You win! Paper beats Rock");
                humanScore += 1;
            }
            else if(x == "rock" && y == "scissors"){
                console.log("You win! Rock beats Scissors");
                humanScore += 1;
            }
            else if(x == "rock" && y == "paper"){
                console.log("You lose! Paper beats Rock");
                computerScore += 1;
            }
            else if(x == "scissors" && y == "paper"){
                console.log("You win! Scissors beats Paper");
                humanScore += 1;
            }
            else if(x == "scissors" && y == "rock"){
                console.log("You lose! Rock beats Scissors");
                computerScore += 1;
            }
            else if(x == y)
            {
                console.log("Its a tie!");
            }
        }

        function playGame()
        {
            
            let counter = 0;

            while(counter < 5){
                let x = getComputerChoice();
                let y = getHumanChoice();
                playRound(x, y);
                counter++;
            }

            if(computerScore > humanScore){
                console.log("You lose! Your score was " + humanScore + " and your opponents score was " + computerScore);
            }
            else if(computerScore < humanScore){
                console.log("You win! Your score was " + humanScore + " and your opponents score was " + computerScore);
            }
            else
            {
                console.log("It is a tie!");
            }
        }

        
        playGame();
        

        

    </script>
</body>
</html>
